name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  docker:
    name: Build & publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Bakes the tag into the image, so the running container reports the
          # release it came from — in its startup log, /api/health and the UI.
          build-args: |
            ADGUARDHUB_VERSION=${{ steps.version.outputs.version }}
          # Written out rather than derived from ${{ github.repository }}. Two
          # reasons, both about renaming this repository: an image name may not
          # contain capitals, so AdGuardHub would fail the push outright — and
          # even in lower case, deriving it means a rename silently publishes to
          # a new package while every existing `docker compose pull` keeps
          # pointing at the old one. The name people already depend on belongs in
          # the file, not in a variable that follows the repository around.
          tags: |
            ghcr.io/fgrfn/adguardhub:${{ steps.version.outputs.version }}
            ghcr.io/fgrfn/adguardhub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tarball:
    name: Build & attach the native install tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Built here rather than on the target host: a native install often lands
      # on an LXC container or a Raspberry Pi, and installing Node there just to
      # produce static files would be a poor trade.
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble the tarball
        run: |
          set -eu
          version="${{ steps.version.outputs.version }}"
          stage="adguardhub-${version}"
          mkdir -p "${stage}/packaging"
          cp -a backend/app "${stage}/app"
          cp -a frontend/dist "${stage}/static"
          cp backend/requirements.txt "${stage}/requirements.txt"
          # The whole packaging directory: the service unit, and the two units
          # plus the script that make the interface's "update now" button work.
          cp packaging/adguardhub.service \
             packaging/adguardhub-update.service \
             packaging/adguardhub-update.path \
             packaging/adguardhub-update.sh "${stage}/packaging/"
          chmod +x "${stage}/packaging/adguardhub-update.sh"
          printf '%s\n' "${version}" > "${stage}/VERSION"
          # Compiled caches from the checkout would otherwise ship to users.
          find "${stage}" -name '__pycache__' -type d -prune -exec rm -rf {} +
          tar -czf "adguardhub-${version}.tar.gz" "${stage}"
          tar -tzf "adguardhub-${version}.tar.gz" >/dev/null

      - name: Attach it to the release
        uses: softprops/action-gh-release@v2
        with:
          files: adguardhub-${{ steps.version.outputs.version }}.tar.gz
